 students taking the alternate assessment. We're doing a disservice to students.", "role": "District test coordinator or district administrator"}, {"id": 179, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "My student was new to our district this year from another state. There did not seem to be much academic instruction nor exposure to navigating a computer prior to his attendance here. We have worked all year to get him to give a consistent, physical response to questions with 2 options. He does not seem to understand what to do and he entered our school as an 8th grader. While I realize this is a unique circumstance, I think there should be some way to Identify these types of students so that the current district is not 'dinged' for what the previous district may or  may not have taught the student.", "role": "Teacher or Test Administrator"}, {"id": 180, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "I think for those that can utilize tools, it is wonderful. However, for some students, some tools may be overwhelming and/or the computer itself may be too overstimulating, and they need 1:1 instruction at all times.", "role": "Teacher or Test Administrator"}, {"id": 181, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC Device", "role": "Teacher or Test Administrator"}, {"id": 182, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Didn\u2019t need or the test was so complex as compared to their cognitive ability that it wasn\u2019t even beneficial.", "role": "Teacher or Test Administrator"}, {"id": 183, "section": "General Feedback", "question": "General Feedback", "comment": "In Ohio, state tests are based on grade-level standards, not where a student is actually working right now. So when a student with an IEP is functioning several grade levels below, there\u2019s a big gap right from the start.\n\nEven if the student has accommodations in their IEP\u2014like extended time, small group, or read-aloud\u2014that support helps them access the test, but it doesn\u2019t make the test easier. The questions are still at grade level.\n\nMost of our students\u2019 IEP goals are based on their present levels and focus on building skills they\u2019re ready for, like basic reading or math. So a student might be making real progress and meeting their goals, but that doesn\u2019t mean they\u2019re ready to pass a grade-level state test yet.\n\nOhio does have an alternate test, the Alternate Assessment for Students with Significant Cognitive Disabilities (AASCD), but that\u2019s only for students with the most significant cognitive disabilities. Most students with IEPs still have to take the regular state tests.\n\nBecause of that, the scores often show the gap between the student\u2019s current level and grade-level expectations\u2014not the growth they\u2019re actually making.\n\nSo it\u2019s important to look at other things too, like:\n\nProgress on IEP goals\nClassroom work and growth over time\nSkills they\u2019re building at their level\n\nState test scores are just one piece of the puzzle\u2014they don\u2019t tell the whole story of what a student can do.", "role": "Teacher or Test Administrator"}, {"id": 184, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I believe the decision making tool should be based more focused on academics and access to general education curriculum and less focused on  daily living skills - meals dressing, bathing  or sensory or medical needs  these are not school related activities! We can address these within the IEP under adaptive goals but to have these part of the decision making tool for academic supports it not beneficial.", "role": "District test coordinator or district administrator"}, {"id": 185, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The online administration for the AASCD is MUCH easier to navigate than it has been in the past. I really like the new way it is done. It's more about what the students know now, versus how it used to be years ago when teacher's were responsible for much more of the work.", "role": "Teacher or Test Administrator"}, {"id": 186, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "In Ohio, state tests are based on grade-level standards, not where a student is actually working right now. So when a student with an IEP is functioning several grade levels below, there\u2019s a big gap right from the start.\n\nEven if the student has accommodations in their IEP\u2014like extended time, small group, or read-aloud\u2014that support helps them access the test, but it doesn\u2019t make the test easier. The questions are still at grade level.\n\nMost of our students\u2019 IEP goals are based on their present levels and focus on building skills they\u2019re ready for, like basic reading or math. So a student might be making real progress and meeting their goals, but that doesn\u2019t mean they\u2019re ready to pass a grade-level state test yet.\n\nOhio does have an alternate test, the Alternate Assessment for Students with Significant Cognitive Disabilities (AASCD), but that\u2019s only for students with the most significant cognitive disabilities. Most students with IEPs still have to take the regular state tests.\n\nBecause of that, the scores often show the gap between the student\u2019s current level and grade-level expectations\u2014not the growth they\u2019re actually making.\n\nSo it\u2019s important to look at other things too, like:\n\nProgress on IEP goals\nClassroom work and growth over time\nSkills they\u2019re building at their level\n\nState test scores are just one piece of the puzzle\u2014they don\u2019t tell the whole story of what a student can do.", "role": "Teacher or Test Administrator"}, {"id": 187, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication board", "role": "Teacher or Test Administrator"}, {"id": 188, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "we do not have a consistent speech therapist to implement these items", "role": "Teacher or Test Administrator"}, {"id": 189, "section": "General Feedback", "question": "General Feedback", "comment": "I think it is time to re-examine the decision making tool criteria. Too many of my students over the years would benefit from being alternately assessed. They would be able to actually show more of what they know, the state would get a better picture of their abilities.", "role": "Teacher or Test Administrator"}, {"id": 190, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think it is easy to use as an IEP team.", "role": "Teacher or Test Administrator"}, {"id": 191, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "My students who now qualify based on the criteria struggle with navigating a computer without supports.", "role": "Teacher or Test Administrator"}, {"id": 192, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Several of our students are unable to access any online testing due to the nature of their disabilities.", "role": "District test coordinator or district administrator"}, {"id": 193, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "switches, communication boards", "role": "Teacher or Test Administrator"}, {"id": 194, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "The students are too low functioning to independently use the AT during the test in a functional way", "role": "Teacher or Test Administrator"}, {"id": 195, "section": "General Feedback", "question": "General Feedback", "comment": "I find that some of the question's on the test is not within my students academic  abilities. My students struggled with taking the test and knowing how to apply logic to answering the questions.", "role": "Teacher or Test Administrator"}, {"id": 196, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The tool is very helpful for the team, however I feel there are some parts that are not always clear when the team is making a decision. Example: In the conceptual domain, we do not even consider students for the alternate assessment unless they are using the extended learning progressions, although I understand the difference of the two statements below, our district most always makes these life-applied units of study that requires intensive accommodations AND multiple tiers of instruction.\n\nConceptual Column 3: The student has difficulty learning grade-level academic content across all subject areas and may require multiple tiers of intervention, accommodations or modifications.\n\nConceptual Column 4: The student has significant difficulty with learning academic content and may require instruction that is designed by clustering grade-level standards into life-applied units of study with intensive accommodations for access.\n\nOverall, our district does appreciate the alternate assessment tool to use and agree upon as a team during IEP meetings.", "role": "District test coordinator or district administrator"}, {"id": 197, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Again the test is not assessing the correct population. It is an ID test not a 1% population test", "role": "Teacher or Test Administrator"}, {"id": 198, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Highlighting the text as it is doing text-to-speech should be a generic, automatic setting. Most of these students cannot read, and that is a universal accessibility feature that most technology provides automatically.", "role": "Teacher or Test Administrator"}, {"id": 199, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "District test coordinator or district administrator"}, {"id": 200, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Our students had no need for any additional tools outside of what was already embedded in the test.", "role": "District test coordinator or district administrator"}, {"id": 201, "section": "General Feedback", "question": "General Feedback", "comment": "I think the AASCD is appropriate for all students who have significant cognitive needs.", "role": "Building test coordinator"}, {"id": 202, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The tool is easy to understand, but it is too restrictive. There are students who would benefit from AASCD but are excluded.", "role": "Reporting-only user (district or building-level)"}, {"id": 203, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "More hoops to jump through and does not do a thing for the student. Testing MD kids is ridiculous and a huge waste of time. If this method worked we would no longer need to take 10 hours writing IEP's.", "role": "Teacher or Test Administrator"}, {"id": 204, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "If a student truly has a MOST significant cognitive disability, they most likely don't have the cognitive skills needed to recognize when these test settings and tools would be helpful during a test.", "role": "Teacher or Test Administrator"}, {"id": 205, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "IPAD", "role": "Teacher or Test Administrator"}, {"id": 206, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "They did not need it.", "role": "Teacher or Test Administrator"}, {"id": 207, "section": "General Feedback", "question": "General Feedback", "comment": "AASCD should better reflect the true needs of students. I find it ridiculous that I am administering this assessment to students who have challenges in identifying or responding to their own name, let alone academic content to be tested on. It is one of my greatest hopes that future students who don't check enough boxes to qualify are able to be relieved of the stress and anxiety of taking a regular state test that feels absolutely impossible.", "role": "Teacher or Test Administrator"}, {"id": 208, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There are students who literally require extensive supports and have very low IQs but don't qualify for alternate assessment because they can toilet themselves. I've had students in the 5th grade at the kindergarten-1st grade level and because they can speak verbally and toilet themselves, they don't qualify. This is highly unfair--they require the extended standards to access the curriculum but don't qualify for the alternate assessment.", "role": "District test coordinator or district administrator"}, {"id": 209, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "My minimally-verbal autistic students have trouble with the testing interface.", "role": "Teacher or Test Administrator"}, {"id": 210, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "The voice for the text to speech could be improved.", "role": "District test coordinator or district administrator"}, {"id": 211, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "IPAD with Tobii Dynovox", "role": "Teacher or Test Administrator"}, {"id": 212, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "unable to use on a daily in the classroom due to disability.", "role": "Teacher or Test Administrator"}, {"id": 213, "section": "General Feedback", "question": "General Feedback", "comment": "The test was way too difficult for my student.", "role": "Teacher or Test Administrator"}, {"id": 214, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision-making tool is helpful for our district to determine who qualifies for Alternate Assessment each year.", "role": "District test coordinator or district administrator"}, {"id": 215, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "I think overall the computerized version is very user friendly. I think personally for my students, who need a lot of redirection and assistance, it was manageable.", "role": "Teacher or Test Administrator"}, {"id": 216, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "I did not administer so I cannot comment on these areas.", "role": "District test coordinator or district administrator"}, {"id": 217, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board", "role": "Teacher or Test Administrator"}, {"id": 218, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Not in IEP or not an appropriate tool", "role": "District test coordinator or district administrator"}, {"id": 219, "section": "General Feedback", "question": "General Feedback", "comment": "This test is hard and long. It needs to make up shorter passages and less questions. It is also unfair that this test is worth 4 years' worth of academics while everyone else is taking EOCs that are 1 year's worth of information.", "role": "Teacher or Test Administrator"}, {"id": 220, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "We have too much paper work already", "role": "Teacher or Test Administrator"}, {"id": 221, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "In Ohio, state tests are based on grade-level standards, not where a student is actually working right now. So when a student with an IEP is functioning several grade levels below, there\u2019s a big gap right from the start.\n\nEven if the student has accommodations in their IEP\u2014like extended time, small group, or read-aloud\u2014that support helps them access the test, but it doesn\u2019t make the test easier. The questions are still at grade level.\n\nMost of our students\u2019 IEP goals are based on their present levels and focus on building skills they\u2019re ready for, like basic reading or math. So a student might be making real progress and meeting their goals, but that doesn\u2019t mean they\u2019re ready to pass a grade-level state test yet.\n\nOhio does have an alternate test, the Alternate Assessment for Students with Significant Cognitive Disabilities (AASCD), but that\u2019s only for students with the most significant cognitive disabilities. Most students with IEPs still have to take the regular state tests.\n\nBecause of that, the scores often show the gap between the student\u2019s current level and grade-level expectations\u2014not the growth they\u2019re actually making.\n\nSo it\u2019s important to look at other things too, like:\n\nProgress on IEP goals\nClassroom work and growth over time\nSkills they\u2019re building at their level\n\nState test scores are just one piece of the puzzle\u2014they don\u2019t tell the whole story of what a student can do.", "role": "Teacher or Test Administrator"}, {"id": 222, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Students who are pre-readers struggle to determine how to use a computer. How are they supposed to use all these tools.", "role": "Teacher or Test Administrator"}, {"id": 223, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC Device", "role": "District test coordinator or district administrator"}, {"id": 224, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "They did not feel they had a need for this.", "role": "Teacher or Test Administrator"}, {"id": 225, "section": "General Feedback", "question": "General Feedback", "comment": "Please reconsider an overhaul of this test, or expand the qualification criteria so more students meet the criteria to take it.  Our students with MOST significant cognitive disabilities struggle significantly to pass a 50 question multiple choice test.  Please consider spending time in the classroom with students with MOST significant cognitive disabilities, or attempt administering this test to a student who truly qualifies to take it.", "role": "Teacher or Test Administrator"}, {"id": 226, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The home districts of the students we receive are not using the decision-making tool to decide AASCD. They are almost always stating do the state test with accommodations and having the student keep testing in grades 9-12 without exempting until the senior year.", "role": "District test coordinator or district administrator"}, {"id": 227, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "paper testing is better for the students because it aligns more with the activities they due in the classroom with tangible objects that can be moved around.", "role": "Teacher or Test Administrator"}, {"id": 228, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Text to speech is not a fluid reading voice and does not support student's listening comprehension.", "role": "Teacher or Test Administrator"}, {"id": 229, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "TTS, large-print calculator, hearing devices/ amplification devices/ speakers, keyboard and mouse instead of trackpad, etc.", "role": "Teacher or Test Administrator"}, {"id": 230, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "My students use their SGD to express basic wants and needs not to answer test questions", "role": "Building test coordinator"}, {"id": 231, "section": "General Feedback", "question": "General Feedback", "comment": "See previous answers", "role": "Teacher or Test Administrator"}, {"id": 232, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Decision-Making Tool is used to guide the process and it does meet that mark.", "role": "District test coordinator or district administrator"}, {"id": 233, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The paper and supplemental kits have too many items to count and recount.  Make them disposable.", "role": "District test coordinator or district administrator"}, {"id": 234, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "My student was unable to access due to his severe deficits.", "role": "Teacher or Test Administrator"}, {"id": 235, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication board, tablet", "role": "Teacher or Test Administrator"}, {"id": 236, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "He used the cards", "role": "Teacher or Test Administrator"}, {"id": 237, "section": "General Feedback", "question": "General Feedback", "comment": "I wish that the assessment process could be more tailored to student needs. The students require such a high degree of specially designed instruction and supports, yet on the test, we are expecting all the students to complete the same assessments.", "role": "Teacher or Test Administrator"}, {"id": 238, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I believe that the decision making tool eliminates students from AASCD access by the rubric's wording.  For example, I have a 10th grade student who does not read and misspells his own first name (on and off) who does not qualify based on the rubric, but he clearly can not access the material covered on EOC tests.  It's cruel to make him sit through the EOC, regardless of accommodations.", "role": "Teacher or Test Administrator"}, {"id": 239, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The DMT needs to be changed.", "role": "Building test coordinator"}, {"id": 240, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "These kids are not even looking at the screen. I have to prompt them for each question and MAYBE they will point to the same spot every time. These kids do not independently do these tests. They definitely do not listen to any instructions about how to use tools or attempt to use them at all.", "role": "Teacher or Test Administrator"}, {"id": 241, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC devices", "role": "Teacher or Test Administrator"}, {"id": 242, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "We have not needed to administer thistest", "role": "District test coordinator or district administrator"}, {"id": 243, "section": "General Feedback", "question": "General Feedback", "comment": "Students are frustrated, staff is frustrated, it's not a good testing experience for our most vulnerable learners.", "role": "Teacher or Test Administrator"}, {"id": 244, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "It is not helpful for the kids who are struggling to participate in the general education setting due to significant Autism.  It really addresses the medically fragile community only.", "role": "Teacher or Test Administrator"}, {"id": 245, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "We have not administered this assessment in the last 3 years", "role": "District test coordinator or district administrator"}, {"id": 246, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "These are limiting accommodations and nothing aligns with the C. Version of the extended standards because you all dismiss people with significant and complex cognitive driven disabilities.", "role": "Teacher or Test Administrator"}, {"id": 247, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Calculator, Speech Output Device", "role": "Teacher or Test Administrator"}, {"id": 248, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "They were no needed to access the assessment", "role": "Teacher or Test Administrator"}, {"id": 249, "section": "General Feedback", "question": "General Feedback", "comment": "The Decision Making Tool needs to be rewritten, it is not very inclusive", "role": "Teacher or Test Administrator"}, {"id": 250, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "It seems as though if a student is able to feed him/herself and use the restroom independently that they no longer qualify for the Alternate Assessment. It is ridiculous that a student who is not able to read or a student who reads at a preK level is having to take the traditional assessments. This causes frustration and is detrimental to students self esteem.", "role": "Teacher or Test Administrator"}, {"id": 251, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Getting rid of the highlighting on the student interface really messed things up this year. The students who take the AASCD most likely are not readers, and so removing the highlighting tool this year really messed things up for a lot of students. This should be a universal feature, as most assistive technologies allow this feature as a standard. I also cannot understand why the passages are so long. IF you cannot read, that is way too much information to have to hold on to. Finally, please change the voice to a human reader.", "role": "Teacher or Test Administrator"}, {"id": 252, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Again, the tools would be more helpful to a student with basic academic and technology skills.", "role": "Teacher or Test Administrator"}, {"id": 253, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Supplemental supports--paper", "role": "Building test coordinator"}, {"id": 254, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Students' IEPs did not specify that AT was needed.", "role": "Teacher or Test Administrator"}, {"id": 255, "section": "General Feedback", "question": "General Feedback", "comment": "Again, if this survey is just about administration, I do not have any comments. \nBut the eligibility requirements do not align with some of the students who would be better assessed by the alternate assessment. As an educator, I value the assessment data provided by the alternate assessment and think it is valid data for the majority of my students who take the assessment. My students who, however, have significant needs and do not qualify for the alternate assessment based on the decision making tool, instead take the general assessment that does not provide any reliable data for me to review as a teacher. It also, for these students, fails to show any valid indication of growth, and these students are growing. Perhaps I don't understand the objective of state testing, but if the objective from the Department of Education is to asses all students with reliability and validity to provide data that can be used to improve their education and track their growth, the eligibility requirements for the alternate assessment are preventing that from happening.", "role": "Teacher or Test Administrator"}, {"id": 256, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision-making tool is needed.   HOWEVER, there is a population of students who do not qualify for the alternate assessment, who would benefit from taking it. These students would be able to show what they know.  However, they are forced to take the regular assessment.  They need more supports than what are allowed on the regular assessment, but do not qualify for AASCD based on the limitations of the decision-making tool. We want to presume competence, but we also need to ensure ALL students are able to prove what they know.", "role": "Teacher or Test Administrator"}, {"id": 257, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "This test is not appropriate for students with MOST significant cognitive disbilities.  If they truly qualify to take this test, they cannot pass this test.", "role": "Teacher or Test Administrator"}, {"id": 258, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "It was hard to have to hear the text read, hear the answers read, and then have  the answers read again. The attention span of the students was taxed-", "role": "Teacher or Test Administrator"}, {"id": 259, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC, pecs, proloquotogo", "role": "District test coordinator or district administrator"}, {"id": 260, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "His devices were not available at the time.", "role": "Teacher or Test Administrator"}, {"id": 261, "section": "General Feedback", "question": "General Feedback", "comment": "The test is very user friendly for the most part. However, it would be much more helpful and appropriate if the test was adaptable (as in the level of the questions change throughout the test depending on how the student is doing). This would allow teachers and parents to recieve a snapshot of where the students `are in certain sub-areas and subjects. Right now, all the parents get to see is their student is not on grade level and is signficantly behind in these subjects. These are parents of students in self contained classrooms with moderate to severe learning disabilites. They already know their child is not on grade level, as do the teachers. It would be better to see a clearer and more specific snapshot of what level they are on in each subjuect and each sub category (i.e. geometry, number sense, measurement for math).", "role": "Teacher or Test Administrator"}, {"id": 262, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "While the decision making tool is helpful, it does not address all possible areas in which a student might need to take an alternate assessment.", "role": "Teacher or Test Administrator"}, {"id": 263, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "My students use the ULS curriculum and it prepares them for the AASCD by using a similar format. \nThe TIDE and CRS platforms can be confusing the navigate, find students, and easily download the results.", "role": "Teacher or Test Administrator"}, {"id": 264, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Again the test is too hard for most all of my students.", "role": "Teacher or Test Administrator"}, {"id": 265, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "option response buttons", "role": "Teacher or Test Administrator"}, {"id": 266, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Students did not bring them to school", "role": "Teacher or Test Administrator"}, {"id": 267, "section": "General Feedback", "question": "General Feedback", "comment": "This test still falls short in reaching severe students.", "role": "Teacher or Test Administrator"}, {"id": 268, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The criteria on the decision making tool and the actual content on the test do not correlate. The test is way more advanced than any student who qualifies via the decision making tool will be able to do.", "role": "Teacher or Test Administrator"}, {"id": 269, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "It would be nice for those students who have human read aloud if they did not have to listen to the computer read it first. Some of our most significant students do not have the attention span to listen to the computer read it and then listen to the exact same thing from the test administrator. Also as mentioned previously it would be nice if there was a middle or bubble test for those students who do not qualify for the Alternate Assessment but are too low to complete the Ohio State Tests. Overall the Alternate Assessment website is very user friendly", "role": "Teacher or Test Administrator"}, {"id": 270, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "The students taking this assessment are not able to use these features.", "role": "Teacher or Test Administrator"}, {"id": 271, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "speech to text", "role": "Teacher or Test Administrator"}, {"id": 272, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Refused to use it.", "role": "Teacher or Test Administrator"}, {"id": 273, "section": "General Feedback", "question": "General Feedback", "comment": "I've stated my concerns in the past comments. These kids should be exempt from testing. I  challenge someone to explain how ANY of the data taken for these tests has helped anyone do anything. How does it help the kids? What are we doing with this data?", "role": "Teacher or Test Administrator"}, {"id": 274, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "None at this time.", "role": "District test coordinator or district administrator"}, {"id": 275, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "I had to help the students navigate the site to get on --- there was alot of reading and clicking necessary", "role": "Teacher or Test Administrator"}, {"id": 276, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "This is not user friendly for visually impaired students.", "role": "Teacher or Test Administrator"}, {"id": 277, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication tablet", "role": "Teacher or Test Administrator"}, {"id": 278, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Students do not use those specific types of assistive technology. They use simplified visuals, different colored papers, large calculators. These items were not needed on the tests.", "role": "Teacher or Test Administrator"}, {"id": 279, "section": "General Feedback", "question": "General Feedback", "comment": "Parents of students with significant disabilities would be outraged if they knew their kids were being put through this soul sucking machine.", "role": "Teacher or Test Administrator"}, {"id": 280, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There are some students who would greatly benefit from the Alternative Assessment, but do not qualify based on your tool. I don't think all of the criteria is appropriate and accounts for all students who may need to the Alternative Assessment.", "role": "Teacher or Test Administrator"}, {"id": 281, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "I have students taking the standard alternate assessment portal who are unable to login themselves and need constant reminders to continue working that would engage much more independently with the alternative Assessment. I think revising the rubric is badly needed. I like that there is a rubric but I think it needs more input from real teachers, in the classroom.", "role": "Teacher or Test Administrator"}, {"id": 282, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "My students do not have the ability to use these tools.", "role": "Teacher or Test Administrator"}, {"id": 283, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Tablets", "role": "Teacher or Test Administrator"}, {"id": 284, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Non verbal and not able", "role": "Teacher or Test Administrator"}, {"id": 285, "section": "General Feedback", "question": "General Feedback", "comment": "The flow chart to determine if a child meets the criteria to take the Alternate Assessment needs to be rewritten. If a child has an Intellectual Disability, they should take the Alternate Assessment and NOT the standard Ohio State Assessment. There is a reason why the IEP team has determined a child is eligible to receive special education services under the disability of Intellectual Disability, and therefore, these children should not be assessed with the same year end assessment as all other students.", "role": "Teacher or Test Administrator"}, {"id": 286, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think the tool is good and needs to be reassessed each year, but it's a little discouraging to parents to hear.  Most parents are realistic and know their students but that doesn't mean its easy to listen to it again.  It would be great if after the first time there was a modified version to see if they've changed or progressed.", "role": "Teacher or Test Administrator"}, {"id": 287, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Most of our students who are completing paper AASCD do not attend our phsycial location.  Maintaining test security and dropping off tests at 5 locations was not difficult, but it was not easy.", "role": "District test coordinator or district administrator"}, {"id": 288, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "I do not administer the AA assessment so I could not answer the above questions.", "role": "District test coordinator or district administrator"}, {"id": 289, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "gaze frames, communication boards or tablets.", "role": "District test coordinator or district administrator"}, {"id": 290, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "The student's AT is mostly low tech, such as picture schedules, first-next and yes-no. He has access to an AAC device but does not use it consistently.", "role": "Teacher or Test Administrator"}, {"id": 291, "section": "General Feedback", "question": "General Feedback", "comment": "I have been administering the Alternate Assessment for years. It is easy to follow and never been a problem. The problem that I have with the Alternate Assessment is who is deciding which students take the test. It should be all resource classroom students. There should not be any decision making tool.", "role": "Teacher or Test Administrator"}, {"id": 292, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool excludes most students that\u2019s are receiving their instruction through a modified functional curriculum taught through essential life skills and instead forces them to take the OST tests that are not appropriate for them.  The students that\u2019s meet the strict guidelines of the decision making tool are learners that\u2019s require immense supports and in turn struggle with the alternate assessment test given the criteria in which they have to take the test. So both sets of students fail and really struggle with finding purpose and a sense of accomplishment of taken the tests. I believe the decision making tool needs to be revamped and the criteria of a AAC needs to be removed.", "role": "Teacher or Test Administrator"}, {"id": 293, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "did not administer this year", "role": "Teacher or Test Administrator"}, {"id": 294, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Any student that would be able to use the tools is not eligible to take the test.", "role": "Teacher or Test Administrator"}, {"id": 295, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication device", "role": "Teacher or Test Administrator"}, {"id": 296, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "student uses low tech visuals; students were still being trained how to use AT - it also gives another level of confusion moving from one screen to another screen to mutiple paper tests.  they forget the question then have to go back to the AT.", "role": "Teacher or Test Administrator"}, {"id": 297, "section": "General Feedback", "question": "General Feedback", "comment": "Personally, I think the teams can determine the most appropriate tool to assess.  Restricting access based on the Decision Making Tool does not support the mission of Special Education.", "role": "Teacher or Test Administrator"}, {"id": 298, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The alternative assessment test is to difficult for the students the flow chart is identifying. The students the flowchart identifies are engagement level students who can not ngage with the format of the test. The test does not have enough pictures for them and the passages are to long for their attention spans", "role": "Teacher or Test Administrator"}, {"id": 299, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Please see my previous response", "role": "Teacher or Test Administrator"}, {"id": 300, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "see past responses", "role": "Teacher or Test Administrator"}, {"id": 301, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "acc devices", "role": "Teacher or Test Administrator"}, {"id": 302, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "The test provided enough support that my students could use the accommodations and be successful to answer", "role": "District test coordinator or district administrator"}, {"id": 303, "section": "General Feedback", "question": "General Feedback", "comment": "This should be optional for many students to opt out of.", "role": "Teacher or Test Administrator"}, {"id": 304, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think the Decision-Making Tool is not adqueate in deciding and helping students needs. I think it has a sharp cut off & needs to be accessible for more students who have severe disabilities.", "role": "Teacher or Test Administrator"}, {"id": 305, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "I've been teaching in Ohio for 18 years. Every version of the Alternative Assessment I've used is a giant waist of time and does not drive IEP writing or programming.", "role": "Interventionist that will be giving the test next year and had to do 5 decision making tools this year"}, {"id": 306, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Please see number 9.", "role": "Teacher or Test Administrator"}, {"id": 307, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Gaze frames", "role": "Teacher or Test Administrator"}, {"id": 308, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "He uses it otherwise but didn't need to use it on the test because he clicked the answers on the test.", "role": "Teacher or Test Administrator"}, {"id": 309, "section": "General Feedback", "question": "General Feedback", "comment": "The AASD test does not give my students the opportunity to demonstrate their abilities.  They have primarily non-verbal autism and are well below grade level.  It would be nice if there was a test that asked for basic skills so the state could track their abilities from year to year.", "role": "Teacher or Test Administrator"}, {"id": 310, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "If a child is absolutely unable to take a test, why are we wasting our time. If you have to stop to change their diapers and feed them through a tube it makes no sense to test them on a computer", "role": "Teacher or Test Administrator"}, {"id": 311, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "from an admin perspective, it is fairly easy to navigate once you have a couple years under your belt, but it isn't always easy for newbies. The discrepancy I notice from training to testing is when we have student needs to access the paper version or the supplemental.", "role": "Teacher or Test Administrator"}, {"id": 312, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "It was a pleasant experience. I can't wait to see how my kiddo performed!", "role": "Teacher or Test Administrator"}, {"id": 313, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "sign language", "role": "Teacher or Test Administrator"}, {"id": 314, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Fully nonverbal, unable to maneuver, no response", "role": "Teacher or Test Administrator"}, {"id": 315, "section": "General Feedback", "question": "General Feedback", "comment": "I do not believe that this is the best option for our students with the highest-support needs. There has to be another option for kids who are barely able to access this assessment.", "role": "Teacher or Test Administrator"}, {"id": 316, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is repetitive when utilized for our low incidence population. For most individuals that quality for the AASCD, there are no changes in their abilities from year to year and completing this tool is further emphasis for families on the things their child is not able to do. This is hurtful in many instances and could be avoided if the tool were only utilized on years where an RETR were completed.", "role": "District test coordinator or district administrator"}, {"id": 317, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The students need alternatively assessed for a reason. The testing format is great for students that need a little extra guidance and support. But for those with less functioning skills, this format is still awful.", "role": "Teacher or Test Administrator"}, {"id": 318, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "I really believe there should be 2 different levels of alternative assessment. I also think some of the questions and pictures need to be updated.", "role": "Teacher or Test Administrator"}, {"id": 319, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "switch", "role": "District test coordinator or district administrator"}, {"id": 320, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "The student that took the Alternate Assessment was very resistive during testing .", "role": "Teacher or Test Administrator"}, {"id": 321, "section": "General Feedback", "question": "General Feedback", "comment": "Absolutely awful. This test was obviously not written by ANYONE who has ever taught sped. A waste of time, a waste of resources.  This assessment in no way shows ANYTHING that my students are capable of.  It was frustrating to say the least.  Each question required so much talking, to the point that by the time I got to the end of the question, even I didn't know what it was asking. Several questions didn't even have a visual to go with the answer choices.  VISUALS.  A proven method that helps my students access content.  Yet another mandate from ODEW that wastes my valuable time TEACHING and shows absolutely nothing.  Great job wasting tax dollars that could be spent on staffing and curriculum.", "role": "Teacher or Test Administrator"}, {"id": 322, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I strongly disagree with the implementation of this decision making tool. Yes, it's easy to use but I have students with significant academic needs who do not qualify under this new-ish decision making tool. I'm putting my students (with moderate-significant disabilities) through the general assessment (with many accommodations) that is completely inappropriate for them. I can see the frustration and their self-esteem being hugely affected. Students are dealing with WAY more than a test developmentally and all of that needs to be taken into consideration when designing these tests.", "role": "Teacher or Test Administrator"}, {"id": 323, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "This test is still way too hard for students with significant cognitive disabilities. It gives no usable data. Even students with just low IQs would struggle to pass this test.", "role": "Teacher or Test Administrator"}, {"id": 324, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Text to speech function had a very delayed response.", "role": "Teacher or Test Administrator"}, {"id": 325, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Students had their devices present, but did not need them during the assessment", "role": "Teacher or Test Administrator"}, {"id": 326, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Because they physically cannot", "role": "Teacher or Test Administrator"}, {"id": 327, "section": "General Feedback", "question": "General Feedback", "comment": "The expectations for students who have to take the standard OST rather than AASCD are absolutely ridiculous.", "role": "District test coordinator or district administrator"}, {"id": 328, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I have concerns regarding the alignment between the current alternate assessment decision-making criteria and the instructional realities of some students with significant cognitive and academic needs. Specifically, students who demonstrate relative strengths in social and practical adaptive skills may not meet eligibility thresholds, despite being unable to access grade-level general education curriculum in a meaningful way without substantial modification and specialized instruction.\n\nIn these cases, the general state assessment may not serve as a valid measure of student learning or growth, given the discrepancy between assessment expectations and the individualized instructional program. This raises questions about the fairness and instructional relevance of requiring participation in the general assessment for students whose educational programming is fundamentally alternative in nature.", "role": "School psychologist (did not administer)"}, {"id": 329, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "My students were frustrated by how long the read aloud feature took to read each question.", "role": "Teacher or Test Administrator"}, {"id": 330, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "While we did work on practice tests the I have that qualify students do not independently access the Testing Tools. During practice they would only use them if they were prompted multiple times to do so.", "role": "Teacher or Test Administrator"}, {"id": 331, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "PRC Accent 800", "role": "Teacher or Test Administrator"}, {"id": 332, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "With the text to speech it was not necessary for them to use their communication program to touch answers choices.", "role": "District test coordinator or district administrator"}, {"id": 333, "section": "General Feedback", "question": "General Feedback", "comment": "I think the decision tool is helpful, but if administration disagrees or the team interprets the questions loosely then the decision tool is not as beneficial in determining who really needs to take the Alternate Assessment.", "role": "District test coordinator or district administrator"}, {"id": 334, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Decision-Making Tool is very helpful, especially for students who were previously on AASCD and are being re-considered.", "role": "Teacher or Test Administrator"}, {"id": 335, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Since the test needs to be administrated 1:1, I think the timeline needs to be extended to the end of April.", "role": "Teacher or Test Administrator"}, {"id": 336, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Text-to-Speech Tracking should be available to set up through the testing portal via the testing administrator.", "role": "Teacher or Test Administrator"}, {"id": 337, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Touch Chat", "role": "Teacher or Test Administrator"}, {"id": 338, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "We have not tested any students in this format", "role": "Did not have a student qualified for this type of Assessment"}, {"id": 339, "section": "General Feedback", "question": "General Feedback", "comment": "The Decision-Making Tool questions do not align with the foundation of Special Education. The traditional state tests are not appropriate for students in cross categorical special education units. These students are taught with a curriculum that does not mirror tradition state tests BUT does mirror the alternate assessment tests. Due to the extremely limiting criteria on the Decision-Making tool, the majority of students in  cross categorical special education units do not qualify for the alternate assessment and instead are subjected to state tests that they are not able to understand and therefor do not reflect their ability of understanding of the content they have been taught. This Decision Making Tool needs to be redesigned to reflect student populations who are in cross categorical special education units so they are able to take an assessment with the content they have been taught throughout the year.", "role": "Teacher or Test Administrator"}, {"id": 340, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Although I believe the Decision Making Tool is invaluable in making the decision to use the Alternative Assessment , I also believe that conversation with the Special Education Director is also important. They may be one aspect such as the student may not need a visual for every transition that could effectively eliminate him/her from the Alternative Assessment even though the student meets all the other criteria.", "role": "Teacher or Test Administrator"}, {"id": 341, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "When you go back from the the test setting page, it will kick the student out of the test and show up in the reporting page as an error. I had a couple students that accidentally pushed the back button on their touch screen and my administrator questioned me about these test sessions because it was showing as not done", "role": "Teacher or Test Administrator"}, {"id": 342, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Students had access to these tools and did not choose to use most of them. I have no recommendations for improvement.", "role": "Teacher or Test Administrator"}, {"id": 343, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication board", "role": "Teacher or Test Administrator"}, {"id": 344, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "My students did no need them.", "role": "Teacher or Test Administrator"}, {"id": 345, "section": "General Feedback", "question": "General Feedback", "comment": "It is unfair for the students that qualify as it is much to difficult.  For any student that would have a chance of answering questions correctly without guessing is not eligible for test.  Feel free to reach out to me anytime to discuss the alternate assessment.  I have been giving the test for 13 years and I have plenty of useful feedback to help the situation.\nAndy Buckingham\nColerain Elementary\n614-937-6178\nabuckingham8671@columbus.k12.oh.us", "role": "Teacher or Test Administrator"}, {"id": 346, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool has made it extremely difficult to qualify students for the alternate assessment. Too many students are being forced to sit through the regular state assessments that are way above their level and beyond appropriate for them to be taking. It\u2019s a complete waste of time.", "role": "Teacher or Test Administrator"}, {"id": 347, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "the test does not have enough visuals and pictures.  sometimes 4 options is too much especially when a kiddo is working on eye gaze with two (left/right) or only yes/no response through blinking.  students are also used to words with visuals and then you take away the visual to words that I'm not allowed to give because then I would be modifying the test because they are not agreed upon visuals from testing.", "role": "Teacher or Test Administrator"}, {"id": 348, "section": "Test Settings & Tools", "question": "Share any additional helpful\u00a0information from your experience regarding Test Settings and Tools for the AASCD.", "comment": "Words when using test to speech were pronounced incorrectly. Example: live", "role": "Teacher or Test Administrator"}, {"id": 349, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Text to speech", "role": "Teacher or Test Administrator"}, {"id": 350, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Text-to-Speech", "role": "Teacher or Test Administrator"}, {"id": 351, "section": "General Feedback", "question": "General Feedback", "comment": "Ive shared my thoughts", "role": "Teacher or Test Administrator"}, {"id": 352, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "In Ohio, state tests are based on grade-level standards, not where a student is actually working right now. So when a student with an IEP is functioning several grade levels below, there\u2019s a big gap right from the start.\n\nEven if the student has accommodations in their IEP\u2014like extended time, small group, or read-aloud\u2014that support helps them access the test, but it doesn\u2019t make the test easier. The questions are still at grade level.\n\nMost of our students\u2019 IEP goals are based on their present levels and focus on building skills they\u2019re ready for, like basic reading or math. So a student might be making real progress and meeting their goals, but that doesn\u2019t mean they\u2019re ready to pass a grade-level state test yet.\n\nOhio does have an alternate test, the Alternate Assessment for Students with Significant Cognitive Disabilities (AASCD), but that\u2019s only for students with the most significant cognitive disabilities. Most students with IEPs still have to take the regular state tests.\n\nBecause of that, the scores often show the gap between the student\u2019s current level and grade-level expectations\u2014not the growth they\u2019re actually making.\n\nSo it\u2019s important to look at other things too, like:\n\nProgress on IEP goals\nClassroom work and growth over time\nSkills they\u2019re building at their level\n\nState test scores are just one piece of the puzzle\u2014they don\u2019t tell the whole story of what a student can do.", "role": "Teacher or Test Administrator"}, {"id": 353, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Instructions need to be clearly stated that the student test settings must be completed prior to the beginning of a test. That test settings may not be corrected after the student has begun the test.", "role": "District test coordinator or district administrator"}, {"id": 354, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Ipad with LAMP: Words for Life", "role": "Teacher or Test Administrator"}, {"id": 355, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "It is not compatible or too difficult to connect", "role": "District test coordinator or district administrator"}, {"id": 356, "section": "General Feedback", "question": "General Feedback", "comment": "I wish more students would be able to use this assessment. It is limited", "role": "Teacher or Test Administrator"}, {"id": 357, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is complicated to use. There are too many items to consider in each category. Also, asking a team to use a decision making tool that focuses on communication, hygiene, and adaptive skills to determine their ACADEMIC state testing eligibility is a major disservice to students. We have students who are significantly cognitively delayed but have incredible family support and have good adaptive skills. These students are working 5+ years below their chronological grade level and do not qualify for AA tests. They are forced to sit in a room to take a grade level test with content that far exceeds their abilities. The criteria needs to be solely focused on academic needs and nothing else.", "role": "District test coordinator or district administrator"}, {"id": 358, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "These kids should not be required to take any state tests. The likelihood of these children becoming independent adults is bleak. Why are we doing this? What is the purpose? They always just pick the same answer over and over. This year I had a student who was zoned out the entire time and only focused to spit into a bottle because she doesn't like to swallow her own spit. Last year a mother had to hand feed tiny chunks of a cheeseburger while I tested her kid so that she wouldn't throw a tantrum. I also almost got attacked. These kids are learning basic independent skills. I ask again, WHY are we doing this? It's so much work on everyone and I don't see the purpose. It would be nice if something was explained for this. How do these tests benefit these students at all?", "role": "Teacher or Test Administrator"}, {"id": 359, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Read aloud - voice output", "role": "Teacher or Test Administrator"}, {"id": 360, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Would not have helped them.", "role": "Teacher or Test Administrator"}, {"id": 361, "section": "General Feedback", "question": "General Feedback", "comment": "My concern is we have students who can take the OST with more accommodations, but we are still placing students on the AASCD.", "role": "District test coordinator or district administrator"}, {"id": 362, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I believe you should open up the eligibility criteria a little bit. I have students that do not have deficits in self help skills/advocacy or communication by the decision tools definition, that cannot succeed in the general education OST.", "role": "Teacher or Test Administrator"}, {"id": 363, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "You don\u2019t give districts versions for teachers to read from for students who have the human-read aloud accommodation so we have to read over a students shoulder. Absurd.", "role": "Teacher or Test Administrator"}, {"id": 364, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "touch screen computers", "role": "Teacher or Test Administrator"}, {"id": 365, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Students do not have the language to understand the test.  They have no need for assistive technology in a daily setting. Some have an AAC device but do not yet know how to communicate with it.", "role": "Teacher or Test Administrator"}, {"id": 366, "section": "General Feedback", "question": "General Feedback", "comment": "Testing works well. Qualifying students is often too specific, when children are very diverse learners,", "role": "Teacher or Test Administrator"}, {"id": 367, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool can be interpreted differently based on the IS and school district. Depending on how closely you look into wording many students who should qualify are not being considered due to specific wording and interpretation based on the person reading it. There needs to be some sort of assessment needed rather than just the teams opionin. For example, my OPINION would be that all my students in a multiple disabilities autism classroom should qualify for alternative assessment due to autism being a cognitive disability.", "role": "Teacher or Test Administrator"}, {"i
