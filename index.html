bodies like non-disabled peers, they can physically go to the bathroom on their own or put their coat on, and they can talk without augmentative devices; but there ability to be safe in a school setting independently is not there, they are monitored when completing self help skills, and even though they can hear what is being said they do not process the the information.  Nevertheless, we have to go through ALLLLLLL definitions (paragraphs) of social domains, communication domains, and so forth. One wrong paragraph, or even sentence, they are kicked out and we have to discuss tier 3.  Not a chance for alternative assessment.  It is NOT meeting a student's needs and showing what they do know.  It makes them move to a test which they will never pass and NEVER show growth.  The verbiage/criteria needs to be changed.  The committee need the change and add words in the definition such as \"like and/or\"  OR \"students need to meet most of the criteria\" OR \"acceptance can be 1 or 2 definitions/paragraphs\" in each domain.   This all or nothing deal needs to be thrown out to meet circumstances which does make this IEP individualize.  If it allows the team to decide and tweak due to the student's individual needs, then it will allow them to appropriately assess students with Signiant mental disabilities and/or disabilities such as Autism.  And no, this not make it so we \"abuse the system\" and allow everyone to be on alternative assessment.  It allows professionals flexibility to assess individua cases.  AND a side bar, the state needs to BRING BACK the third choice for assessment.  The ability for students to still take OST but in modified form.  For the students who are moderate mental abilities have their test modified so the questions have less words, less application questions, and more visuals.", "role": "Teacher or Test Administrator"}, {"id": 557, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board", "role": "Teacher or Test Administrator"}, {"id": 558, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think it shouldn't be used for deciding who qualifies for testing. If a student is his the resource room/self-contained classroom they should be taking the Alternate Assessment- We are receiving students from the School of Bright Promise and they are not even taking that Alternate Assessment.", "role": "Teacher or Test Administrator"}, {"id": 559, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "LAMP", "role": "Teacher or Test Administrator"}, {"id": 560, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I feel that the communication piece of students ability is open to a wide interpretation", "role": "District test coordinator or district administrator"}, {"id": 561, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication Device AAC", "role": "Teacher or Test Administrator"}, {"id": 562, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The student population we are currently teaching doesn't go to preschool, so that criterion makes students ineligible who shouldn't be. This is exacerbated by covid", "role": "Teacher or Test Administrator"}, {"id": 563, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication devices", "role": "Teacher or Test Administrator"}, {"id": 564, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "This was a new process for me, and it was laid out in an easy-to-understand format.", "role": "Teacher or Test Administrator"}, {"id": 565, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication tablets", "role": "Teacher or Test Administrator"}, {"id": 566, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think that the decision making tool focuses too heavily on having a disability in the area of communication. I don't think it takes into account level of stamina, the manner in which students are assessed according to the IEP or accommodations students are given daily according to the IEP.", "role": "Teacher or Test Administrator"}, {"id": 567, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board/tablets", "role": "Teacher or Test Administrator"}, {"id": 568, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "It is very detailed and easy to follow.", "role": "District test coordinator or district administrator"}, {"id": 569, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "text to speech, visuals", "role": "Teacher or Test Administrator"}, {"id": 570, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I don't feel the need to evaluate annually. It seems like it could be done at the IEP following the ETR and be good until the next ETR (three years).", "role": "Teacher or Test Administrator"}, {"id": 571, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "speaking device", "role": "Teacher or Test Administrator"}, {"id": 572, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There should be more defined boundaries of required qualifying skills or attributes.  For example, remove the vague language, (ie. \"student MAY...\").", "role": "District test coordinator or district administrator"}, {"id": 573, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication tablets (various)", "role": "Teacher or Test Administrator"}, {"id": 574, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "An annual evaluation of student needs using the decision making tool is unnecessary.  Students witch such significant needs do not need this compelted annually.  A team could do it once, and then revisit the discussion as growth and needs evolve.  \n\nI marked the second item low, because there still seems to be a significant discrepency in who is eligible for alternate assessment (based upon the tool and supports in classroom), even for those with significant cognitive profiles.", "role": "District test coordinator or district administrator"}, {"id": 575, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication Device", "role": "Teacher or Test Administrator"}, {"id": 576, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "It is a long form to include in the IEP.  Would like the option to make the decision once and let it apply to following years unless a change in the student's needs warrants need to make a new determination.", "role": "Teacher or Test Administrator"}, {"id": 577, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Calculator", "role": "Teacher or Test Administrator"}, {"id": 578, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Some students in the MD program don\u2019t qualify for AASCD due to their social capabilities, but still would benefit from the AASCD.", "role": "Speech-Language Pathologist"}, {"id": 579, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Talker using LAMP software", "role": "District test coordinator or district administrator"}, {"id": 580, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Language of the Decision-Making Tool is complex and not easily understood by students and parents who are critical members of the IEP team.  The tool sets clear limits for participation in AASCD.  However, this does not mean that OSTs are appropriate for anyone not meeting this criteria.  I appreciate that the tool guides teams to less subjective decisions but the system as a whole still leaves a serious gap for students who are not currently appropriately assess by either option. OTES 2.0 notes that the accomplished teacher \" offers differentiated assessment choices to meet the full range of student needs\" and yet the state does not assess students in this manner.", "role": "District test coordinator or district administrator"}, {"id": 581, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication devices", "role": "Reporting-only user (district or building-level)"}, {"id": 582, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I feel as though the communication section of the Decision-Making Tool could negatively impact a qualifying student if they are in a higher grade level and Speech Services have been decreased due to \"aging out\". The deficit in the domain area of communication exists for these kids but services are always being offered. I think there needs to be an Asterix to indicate the student might not be receiving services outside of \"consult\" but there is a clear communication need that contributes to the factor of needing the Alternate Assessment.", "role": "Teacher or Test Administrator"}, {"id": 583, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC", "role": "Teacher or Test Administrator"}, {"id": 584, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is too detailed and does not allow for proper assessment for students. By making us use this tool you are making our students take the standard state test (because they don't qualify for the alt-test), which is highly inappropriate and unfair to our students. Its insane and makes me sick that I have to give the standard test to my students because I have to use this stupid tool. You all need to come sit in our classrooms, meet the students, see the needs and then give them the standard state test to see how ridiculous it is.", "role": "Teacher or Test Administrator"}, {"id": 585, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "We used this tool but it was not helpful in making determinations regarding AASCD testing. It was extraneous and tedious to the IEP process. The profile and present levels provide ample information for decision making regarding testing appropriateness. This tool was unnecessary overkill. We generally went through it quickly and signed b/c of its redundancy. Thank you for asking for our feedback!", "role": "Reporting-only user (district or building-level)"}, {"id": 586, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "No additional information at this time.", "role": "Teacher or Test Administrator"}, {"id": 587, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There is one portion of the tool that asks if the student can dress themselves feed themselves etc. I have seen students meet those needs but function around a kindergarten to 1st grade level. I feel this is not fair to students.", "role": "Teacher or Test Administrator"}, {"id": 588, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "When reviewing annually, I don't see value in doing so from the perspective of students with severe impairments, given that there would be limited to no change in intelligence as shown by the ETR data. I think reviewing every 3 years and aligning with an ETR would make sense for students with severe impairments.\n\nWith parents being a big part of the IEP, it would be nice to see a balance between professional and parent-friendly language throughout the decision-making tool.", "role": "Teacher or Test Administrator"}, {"id": 589, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "N/a", "role": "Teacher or Test Administrator"}, {"id": 590, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool focuses on specific daily living skills, such as using the bathroom and dressing oneself, while the AASCD focuses on academics. There does not seem to be alignment in the skills noted on the decision making tool and the actual test. The decision making tool is too stringent in assuming that a student not qualifying for the AASCD because they can indicated the need for the restroom, for example, will be accurrately assessed using the OST.", "role": "District test coordinator or district administrator"}, {"id": 591, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is very complex and difficult for even seasoned intervention specialists to understand.  It is very complicated for families to understand.  While I don't disagree with the purpose of the tool, it is unfortunate that there is no statewide assessment that better reflects the abilities of our students who are not quite our most significantly disabled, but also are not going to pass assessments with just accommodations.", "role": "Reporting-only user (district or building-level)"}, {"id": 592, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The testing process is worthless for most of the students with severe disabilities.   Out of 8 students that I teach 3 of them could navigate and understand portions of the AASCD.  I think it is a huge waste of time and money to make our lowest functioning students participate in this testing.  I wish the flowchart addressed this need and excused these students from testing.", "role": "Teacher or Test Administrator"}];

    // State Persistence via LocalStorage
    let favorites = JSON.parse(localStorage.getItem('aascd_favs') || '{}');
    let notes = JSON.parse(localStorage.getItem('aascd_notes') || '{}');

    document.addEventListener("DOMContentLoaded", () => {
        initFilters();
        render();
    });

    function initFilters() {
        const roleSelect = document.getElementById('roleFilter');
        const sectionSelect = document.getElementById('sectionFilter');

        const roles = [...new Set(rawResponses.map(r => r.role))].sort();
        const sections = [...new Set(rawResponses.map(r => r.section))];

        roles.forEach(role => {
            const opt = document.createElement('option');
            opt.value = role;
            opt.textContent = role;
            roleSelect.appendChild(opt);
        });

        sections.forEach(sec => {
            const opt = document.createElement('option');
            opt.value = sec;
            opt.textContent = sec;
            sectionSelect.appendChild(opt);
        });

        ['search', 'roleFilter', 'sectionFilter', 'statusFilter'].forEach(id => {
            document.getElementById(id).addEventListener('input', render);
        });
    }

    function toggleFavorite(id) {
        if (favorites[id]) {
            delete favorites[id];
        } else {
            favorites[id] = true;
        }
        localStorage.setItem('aascd_favs', JSON.stringify(favorites));
        render();
    }

    function addNote(id) {
        const input = document.getElementById(`note-input-${id}`);
        const text = input.value.trim();
        if (!text) return;

        if (!notes[id]) notes[id] = [];
        notes[id].push({
            noteId: Date.now(),
            text: text,
            date: new Date().toLocaleDateString()
        });

        localStorage.setItem('aascd_notes', JSON.stringify(notes));
        render();
    }

    function deleteNote(itemId, noteId) {
        if (!notes[itemId]) return;
        notes[itemId] = notes[itemId].filter(n => n.noteId !== noteId);
        if (notes[itemId].length === 0) delete notes[itemId];
        localStorage.setItem('aascd_notes', JSON.stringify(notes));
        render();
    }

    function toggleNotesPanel(id) {
        const box = document.getElementById(`notes-box-${id}`);
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function render() {
        const searchVal = document.getElementById('search').value.trim();
        const roleVal = document.getElementById('roleFilter').value;
        const sectionVal = document.getElementById('sectionFilter').value;
        const statusVal = document.getElementById('statusFilter').value;

        const isFiltered = searchVal !== '' || roleVal !== 'ALL' || sectionVal !== 'ALL' || statusVal !== 'ALL';
        document.getElementById('resetBtn').style.display = isFiltered ? 'inline' : 'none';

        const filtered = rawResponses.filter(item => {
            const matchRole = roleVal === 'ALL' || item.role === roleVal;
            const matchSection = sectionVal === 'ALL' || item.section === sectionVal;
            const matchSearch = !searchVal || 
                item.comment.toLowerCase().includes(searchVal.toLowerCase()) || 
                item.question.toLowerCase().includes(searchVal.toLowerCase());
            
            let matchStatus = true;
            if (statusVal === 'FAV_ONLY') matchStatus = !!favorites[item.id];
            if (statusVal === 'NOTES_ONLY') matchStatus = !!(notes[item.id] && notes[item.id].length > 0);

            return matchRole && matchSection && matchSearch && matchStatus;
        });

        document.getElementById('stats').textContent = `Showing ${filtered.length} of ${rawResponses.length} total responses`;

        const feed = document.getElementById('feed');
        if (filtered.length === 0) {
            feed.innerHTML = `
                <div class="no-results">
                    <h3>No matching survey responses found</h3>
                    <p style="margin-top:0.5rem;">Try adjusting your keyword search or filter criteria.</p>
                </div>
            `;
            return;
        }

        feed.innerHTML = filtered.map(item => {
            const isFav = !!favorites[item.id];
            const itemNotes = notes[item.id] || [];

            return `
            <div class="card">
                <div class="card-header">
                    <div class="badges">
                        <span class="badge badge-sec">${escapeHTML(item.section)}</span>
                        <span class="badge badge-role">${escapeHTML(item.role)}</span>
                    </div>
                </div>
                <div class="question-label">Q: ${escapeHTML(item.question)}</div>
                <div class="comment-text">${highlightText(item.comment, searchVal)}</div>

                <!-- Action Controls -->
                <div class="card-actions">
                    <button class="btn-action btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${item.id})">
                        ${isFav ? '★ Favorited' : '☆ Favorite'}
                    </button>
                    <button class="btn-action" onclick="toggleNotesPanel(${item.id})">
                        💬 Action Notes (${itemNotes.length})
                    </button>
                </div>

                <!-- Notes / Comment Panel -->
                <div class="notes-section" id="notes-box-${item.id}" style="display: ${itemNotes.length > 0 ? 'block' : 'none'};">
                    <div class="notes-title">Addressing Action Notes & Comments</div>
                    <div class="notes-list">
                        ${itemNotes.map(n => `
                            <div class="note-item">
                                <span><strong>[${n.date}]:</strong> ${escapeHTML(n.text)}</span>
                                <span class="delete-note" onclick="deleteNote(${item.id}, ${n.noteId})" title="Delete Note">✕</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="note-input-group">
                        <input type="text" id="note-input-${item.id}" placeholder="Add comment or action step..." onkeydown="if(event.key==='Enter') addNote(${item.id})">
                        <button onclick="addNote(${item.id})">Add Comment</button>
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    function resetFilters() {
        document.getElementById('search').value = '';
        document.getElementById('roleFilter').value = 'ALL';
        document.getElementById('sectionFilter').value = 'ALL';
        document.getElementById('statusFilter').value = 'ALL';
        render();
    }

    function highlightText(text, term) {
        const escaped = escapeHTML(text);
        if (!term) return escaped;
        const regex = new RegExp(`(${escapeRegExp(term)})`, 'gi');
        return escaped.replace(regex, '<mark>$1</mark>');
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
</script>
</body>
</html>
