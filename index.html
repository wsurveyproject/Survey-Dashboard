d": 368, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The assessment is difficult to administer with fidelity for students who lack basic awareness or the ability to engage with the tasks appropriately.", "role": "Teacher or Test Administrator"}, {"id": 369, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Tablet with LAMP (test page set up)", "role": "Teacher or Test Administrator"}, {"id": 370, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "He pointed to his response. He had his device with him but chose to point instead.", "role": "Teacher or Test Administrator"}, {"id": 371, "section": "General Feedback", "question": "General Feedback", "comment": "overall- positive", "role": "Teacher or Test Administrator"}, {"id": 372, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Students with the most severe cognitive impairments should not be required to participate in any testing.  It's not a matter of a tool being used properly or aligning the assessment, it's that the assessments are not useful in measuring student progress.", "role": "District test coordinator or district administrator"}, {"id": 373, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Every student that is being taught by the extended standards should be taking the Alternate Assessment. They should not be taking the regular education state test.", "role": "Teacher or Test Administrator"}, {"id": 374, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board", "role": "District test coordinator or district administrator"}, {"id": 375, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "I did not administer any assessments", "role": "District test coordinator or district administrator"}, {"id": 376, "section": "General Feedback", "question": "General Feedback", "comment": "I already entered all I wanted to say", "role": "Teacher or Test Administrator"}, {"id": 377, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think it needs to be clearer.", "role": "Teacher or Test Administrator"}, {"id": 378, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "This test is way too hard for my students. Even though they are in the grade the test is too hard and does not show what they do know.", "role": "Teacher or Test Administrator"}, {"id": 379, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication boards", "role": "Teacher or Test Administrator"}, {"id": 380, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "He refused to use it.", "role": "Teacher or Test Administrator"}, {"id": 381, "section": "General Feedback", "question": "General Feedback", "comment": "I truly believe that the guidelines to be able to take the AASCD need to be less exclusive. I have 9 students; only 1 qualified to take the AASCD (this student is an 11 year old 4th grader who wears a pull-up and functions at a 3 year old level). The AASCD is too hard for this student. However, my other 8 students all have IQs in the 70s or below, have significant processing issues and their working memories are almost non-existent. They could possibly do quite well on the AASCD, but because they can toilet themselves they do not qualify to take the AASCD. I fail to see the correlation between being able to complete self-help skills and being able to take a test that students who are functioning at an average level have trouble taking. My students are in my classroom for a reason; they are significantly behind their peers and do not have the cognitive ability to \"catch up\". So, why not give them a test, such as the AASCD, in which they could be successful?", "role": "Teacher or Test Administrator"}, {"id": 382, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Determining an assessment most appropriate for a student should have nothing to do with their level of independence with daily living skills (e.g. toileting) and other questions that seem to have nothing to do with appropriate assessments. It should be based on the standards used and current academic / cognitive functioning, and the people who know them best. I have students who can't even add or write a sentence who are expected to participate in regular Ohio State Tests simply because he is independent in the bathroom and can use an SGD to tell me he wants water.", "role": "Building test coordinator"}, {"id": 383, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Navigating the Alternate Assessment is easy to navigate and I appreciate that with students with severe disabilities. The students were able to catch on to how to navigate the assessment.", "role": "District test coordinator or district administrator"}, {"id": 384, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC", "role": "Teacher or Test Administrator"}, {"id": 385, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Because it was not always appropriate.  Students who had AT often could not comprehend the question so no response was given.  AT students who could understand would still qualify for normal OST testing because their mental abilities were higher.", "role": "Teacher or Test Administrator"}, {"id": 386, "section": "General Feedback", "question": "General Feedback", "comment": "This was my first experience providing students with Alternative Assessments and I was surprised by how well students did on this test. I think it presented things in a good sequence and was fairly easy for students to understand. I was less than impressed with the text to speech, just because it is a monotone, boring kind of voice that is often hard for adults to stay engaged with, let alone students with cognitive disabilities.", "role": "Teacher or Test Administrator"}, {"id": 387, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "While the Decision-Making Tool was used and is understood, I believe that the criteria needed to qualify a student for this assessment needs reassessed. It is not understood how a student currently working on identifying the addition and subtraction symbol is required to take the regular state test and not the Alternate Assessment. While the Decision-Making Tool is helpful in being able to say \"yes\" or \"no\" to a student's qualification, it is not helpful at all in identifying those students who would really benefit from this assessment as opposed to the traditional test.", "role": "Teacher or Test Administrator"}, {"id": 388, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "See previous extended response", "role": "Other"}, {"id": 389, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "tablets", "role": "Teacher or Test Administrator"}, {"id": 390, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "We didn't have students taking the Alternate Assessment", "role": "Teacher or Test Administrator"}, {"id": 391, "section": "General Feedback", "question": "General Feedback", "comment": "The test is very bland for the population of students who qualify to take it and require immediate positive feedback compared to the curriculum resources and assessments that mimic the test.  An addition to consider would be some type of positive feedback for each answer submitted, such as star/firework/happy face that appears on the screen paired with a positive sound like a chime.  This would not need to indicate if the answer was correct or incorrect, just an acknowledgement that the student answered.", "role": "Teacher or Test Administrator"}, {"id": 392, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is time consuming and tells us what a professional already knows.  I have never had something surprise me from using the tool which tells me it is unecessary and another way to invalidate the training and experience of interventionists and special education personnel.  These decisions should be very individualized and the tool does not allow us to tell the \"whole story\" of a child.", "role": "District test coordinator or district administrator"}, {"id": 393, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The test title was a confusing description and my test coordinator and I had to reach out to find the test.", "role": "Teacher or Test Administrator"}, {"id": 394, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Voice output device", "role": "District test coordinator or district administrator"}, {"id": 395, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Student is visually impaired and works well on screens.", "role": "Teacher or Test Administrator"}, {"id": 396, "section": "General Feedback", "question": "General Feedback", "comment": "Let more students be allowed to take this test.", "role": "Teacher or Test Administrator"}, {"id": 397, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision-making tool is still limited, but it is better than it was a few years ago.", "role": "Teacher or Test Administrator"}, {"id": 398, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "My students did not navigate the student interface on their own in any way.", "role": "Teacher or Test Administrator"}, {"id": 399, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Switch with partner assisted scanning, AAC on iPads, supplemental paper materials", "role": "Teacher or Test Administrator"}, {"id": 400, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Student uses the line reader", "role": "Teacher or Test Administrator"}, {"id": 401, "section": "General Feedback", "question": "General Feedback", "comment": "There are too many questions for students to answer.", "role": "Teacher or Test Administrator"}, {"id": 402, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is clear enough, and helps determine if a student has a significant cognitive disability.", "role": "Teacher or Test Administrator"}, {"id": 403, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "My students would point to the screen for identify their answers, however, they were not able to move between questions or scroll through the readings.", "role": "Teacher or Test Administrator"}, {"id": 404, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC, switches", "role": "District test coordinator or district administrator"}, {"id": 405, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "This student requested a paper test.", "role": "Teacher or Test Administrator"}, {"id": 406, "section": "General Feedback", "question": "General Feedback", "comment": "It was pretty easy to navigate but for our LI population it was still way over their heads. Their needs to be different levels.", "role": "Teacher or Test Administrator"}, {"id": 407, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool includes a lot of AND/OR statements that are subjective and lead to a lot of students who should qualify for the (very well designed) AASCD end up not being eligible.", "role": "Teacher or Test Administrator"}, {"id": 408, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The current assessment structure for students with the most significant needs raises serious concerns. For many of these students, the standardized testing format does not accurately reflect their abilities, progress, or potential. Instead, it often leads to frustration, disengagement, and in some cases, emotional distress.\n\nThere appears to be a disconnect between the intent of these assessments and the functional, real-world skills our students are working hard to develop. While some students on extended standards may be working toward higher academic benchmarks, others are being required to take assessments that are not aligned with their instructional level, even with accommodations in place. This mismatch can prevent students from demonstrating what they truly know and can do.\n\nAn additional concern is the constraints surrounding assessment eligibility. Current policies and accountability measures can make teams hesitant to assign students to alternate assessments\u2014even when it may be instructionally appropriate\u2014due to potential impacts on funding or program compliance. This creates a situation where decisions may be influenced by external pressures rather than what is best for the individual student.\n\nA portfolio-based approach, or a more individualized assessment model, would provide a more meaningful and comprehensive picture of student growth. It would allow educators to highlight communication, vocational, social, and daily living skills\u2014areas that are critical for long-term success and independence.\n\nAs educators, our responsibility is to prepare students to be contributing members of their communities. Aligning assessments with that goal would better serve both students and teachers, while also providing more accurate data to guide instruction and decision-making.", "role": "Teacher or Test Administrator"}, {"id": 409, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Test read aloud", "role": "Teacher or Test Administrator"}, {"id": 410, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "The AAC device was available, but the student chose not to use it.", "role": "Teacher or Test Administrator"}, {"id": 411, "section": "General Feedback", "question": "General Feedback", "comment": "The IEP team had a difficult time using the decision-making tool. Many members of the team read the decision-making tool differently, which made it hard to use and be clear.", "role": "Teacher or Test Administrator"}, {"id": 412, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making framework is helpful to have as a guide when determining if students do or do not qualify for the alternate assessment. I do feel as though some of the information, for example whether a student needs assistance in the bathroom should not really be a measure as to whether they do or do not qualify. I also think that there should be a middle test in between the Ohio State Tests and the Alternate Assessment. There are many students that do not qualify for the Alternate Assessment and have to take the Ohio State Tests but those tests are completely inappropriate. There should be an in-between test for those bubble students who no longer qualify for the Alternate but that still need an assessment that is modified to fit their level of understanding. Overall though in regards to the framework, it is a helpful tool and does make things easy when going through each box in regards to if the student does or does not qualify.", "role": "Teacher or Test Administrator"}, {"id": 413, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Many of my students need things explained in more depth.  If I was able to explain a question to them, they would be better able to answer the question correctly.  In a public separate facility, the students are usually very low cognitively and the things that are asked are not relevant to what we work on in the classroom on a daily basis.", "role": "Teacher or Test Administrator"}, {"id": 414, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication boards", "role": "Teacher or Test Administrator"}, {"id": 415, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "student choose  not to", "role": "Teacher or Test Administrator"}, {"id": 416, "section": "General Feedback", "question": "General Feedback", "comment": "Please improve test score sharing and accuracy of what test a student needs.", "role": "Building test coordinator"}, {"id": 417, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Students receiving IEPs have tailored instruction at their independent learning level with various supports and modifications  The decision making flow chart does not take that into consideration when qualifying a student for Alternate assessment   Many students in MD classrooms should be exempt from testing or at least permitted to take the alternate assessment.", "role": "Teacher or Test Administrator"}, {"id": 418, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "There were too many words for my students to process the information in each question and answer.", "role": "Teacher or Test Administrator"}, {"id": 419, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Touch Chat", "role": "Teacher or Test Administrator"}, {"id": 420, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "He uses AT, but can also verbalize a, b, c, d, repeat me and is able to select an answer on the screen without needing his AT device.", "role": "Teacher or Test Administrator"}, {"id": 421, "section": "General Feedback", "question": "General Feedback", "comment": "I do not see the value of this process for many of the students that I teach.  How much valuable information is gained for students who cannot demonstrate what they understand.", "role": "Teacher or Test Administrator"}, {"id": 422, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I STRONGLY feel that the state needs a MIDDLE test for students who are to high for the Alt test but to low for the OAA test.", "role": "Teacher or Test Administrator"}, {"id": 423, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The interface was very user friendly and easy to use", "role": "Teacher or Test Administrator"}, {"id": 424, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device was available", "role": "Teacher or Test Administrator"}, {"id": 425, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "They are taken to another room and given assistance.", "role": "Teacher or Test Administrator"}, {"id": 426, "section": "General Feedback", "question": "General Feedback", "comment": "The AASCD should be available to students that have low cognitive abilities to where they are limited to how much grade level content is able to be learned despite being able to basically have a conversation, which automatically does not qualify them.", "role": "Teacher or Test Administrator"}, {"id": 427, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Decision-Making Tool is user friendly for parents and staff.", "role": "District test coordinator or district administrator"}, {"id": 428, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Any of my students that would be able to navigate the test where not eligible to take the test due to the terrible criteria check list.", "role": "Teacher or Test Administrator"}, {"id": 429, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board", "role": "Teacher or Test Administrator"}, {"id": 430, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "I did not administer the Alternate Assessment this year.", "role": "Teacher or Test Administrator"}, {"id": 431, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is very complicated and does not account for all students that benefit from taking the alternate assessment.", "role": "Teacher or Test Administrator"}, {"id": 432, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Thank you for providing the ability to stop the test after 4 unanswered questions.", "role": "Teacher or Test Administrator"}, {"id": 433, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "Teacher or Test Administrator"}, {"id": 434, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "Student does not utilize assistive technology devices", "role": "District test coordinator or district administrator"}, {"id": 435, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I believe the criteria is too focused on adaptive living skills that does not properly account for the challenges faced by students which may make it difficult for them to show what they know on the standard state test. I have students who are a 3 in the social domain because they can communicate some thoughts and ideas but not with the complexity to show all they know. I have students unable to spell their own name who can greet people that, based on my understanding of the rubric, means they should be taking the standardized State test. It seems to me that if a student does not know their letters or how to decode because of the impact of their intellectual disability it is unfair to expect that student to read multiple complex passages at grade level to answer complicated questions.", "role": "Teacher or Test Administrator"}, {"id": 436, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Please see my previous response about the changes which should be made.", "role": "Teacher or Test Administrator"}, {"id": 437, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication tablet", "role": "Teacher or Test Administrator"}, {"id": 438, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "The student I tested did not have AT during class instruction.", "role": "Building test coordinator"}, {"id": 439, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "did not give the test this year", "role": "Teacher or Test Administrator"}, {"id": 440, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Assessment questions are often too high of level for students who are taking this test. Many students need short fill in the blank options with pictures or life skills related questions. The majority of our students are Developmentally Disabled with low IQs and Multiple Disabilities. If the state would like to see skill mastery, please allow students to feel successful and provide questions at level.", "role": "Teacher or Test Administrator"}, {"id": 441, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication devices on tablets", "role": "Teacher or Test Administrator"}, {"id": 442, "section": "Reason Assistive Tech Not Used", "question": "Please explain why student(s) did not use Assistive Technology", "comment": "They are just learning to navigate the Assistive Technology.  The students are not ready to use this in a testing setting.", "role": "Teacher or Test Administrator"}, {"id": 443, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Decision-Making Tool only allows for extreme physical, cognitive, or communicative disabilities. The General Education tests, however, do not accommodate students who may not have severe disabilities but still have enough cognitive delays that accessing these tests is not appropriate. There must be more nuance and a wider range of appropriate and available tests to meet the needs of all learners, not just opposite extremes on the spectrum of disabilities and abilities to learn. The whole system is rigged. End testing and ALL students will begin learning in meaningful, effective ways.", "role": "Teacher or Test Administrator"}, {"id": 444, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "I was impressed by how well laid out everything was.", "role": "Teacher or Test Administrator"}, {"id": 445, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "switches", "role": "Teacher or Test Administrator"}, {"id": 446, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Students who don't qualify for the alternative assessment due to the ability to speak is not acceptable.  I have a student who could qualify but is verbal but her verbal babble is not relatable to the content due to her disability.", "role": "Teacher or Test Administrator"}, {"id": 447, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "I navigate for my students. Many of my students can't write or can write/circle etc. not well but if they were given a Chromebook they would click through all questions in about 3 minutes. I need to watch them carefully.", "role": "Teacher or Test Administrator"}, {"id": 448, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Voice out put devices, communication boards", "role": "Teacher or Test Administrator"}, {"id": 449, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "My \u201cstrongly agree\u201d rating reflects compliance with a required tool\u2014not endorsement of its effectiveness. As designed, the tool frequently excludes students with significant cognitive disabilities who may demonstrate isolated adaptive skills (e.g., toileting or limited social skills) but otherwise function several grade levels below and receive instruction outside the general education setting for more than 60% of the day on extended or modified standards.\n\nIt is concerning that teams must justify eligibility for the alternate assessment (AA) when the assessment provides limited meaningful information about student abilities. The AA often assesses content (e.g., multiplication in third grade or Algebra at the high school level) that is not aligned to many students\u2019 current instructional levels, where the focus remains on foundational skills such as addition and subtraction. As a result, teams are placed in the position of determining that a student is not \u201cimpaired enough\u201d for AA while also administering general assessments that are not accessible or appropriate.\n\nStudents\u2019 ETRs clearly document their needs, and the IEP team has established an appropriate LRE. These factors should carry greater weight in assessment determinations.", "role": "Interventionist that will be giving the test next year and had to do 5 decision making tools this year"}, {"id": 450, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The speak button was very slow to start speaking, often resulting in students loosing interest and not attending to the screen when the speech started.  I thought maybe it was our building/district internet connection, however, in talking with other teachers who administered the AASCD in other schools and districts, they experienced the same delay.", "role": "Teacher or Test Administrator"}, {"id": 451, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "Teacher or Test Administrator"}, {"id": 452, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Decision-Making Tool is fine, but the Alternate Assessment is not appropriate for some students and the OST is too challenging for students.  There should not be a cap on the number of students who can take the AA.  Students with Autism or other disabilities have skills that cannot be assessed by a typical assessment.  Also, the gap between Alternate Assessment and the OST is so great that students become overwhelmed taking the OST. They have significant accommodations and modifications in order to participate in the general education classroom, yet, many of those supports are not allowed during testing. It causes undue stress.  It is known that around 85% of students with Autism are unemployed or underemployed in the US. Our focus should be specific focus on their strengths and employability.", "role": "Teacher or Test Administrator"}, {"id": 453, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "I wish there was a way we could capture more about some of the students who do not engage in content in typical ways. These students are exposed to and participate in lessons based on the State Standards (Extended) guidelines and they show so much growth in success in the classroom. However, when they take these formatted assessments (even with exposure to similar formats throughout the year) we are not seeing the true depth and knowledge of that child. In the past- allowing evidence of portfolios would allow other ways to show student success and engagement. I have some students that consistently just click the third option each time- so yes they may get a decent score as long as enough of the answers were in the third space. Also I feel it is not very clear how accommodations should look in section 12 of the IEP if a student is alternatively assessed.", "role": "Teacher or Test Administrator"}, {"id": 454, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "iPad with Touch Chat", "role": "Teacher or Test Administrator"}, {"id": 455, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool does not take into account the level of individualized needs of the students in relationship to the specialized instruction that is given. The form is not parent friendly and the families are often not invested in following the tool.", "role": "Teacher or Test Administrator"}, {"id": 456, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "In my experience students qualified for AASCD using the tool are have learning challenges that make it difficult for them to access the curriculum and the online assessments are inappropriate to truly identify what they know and what they can show", "role": "Teacher or Test Administrator"}, {"id": 457, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "gaze", "role": "Teacher or Test Administrator"}, {"id": 458, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The tool is easy to understand and use, BUT it doesn't represent students well.  Just because a student has a mode of communication doesn't mean that intellectually they are able to complete the items on the test. Additionally since moving to this format of testing it's not as telling of students educational abilities as the previous format was. Lowering the reading level and the graphics on a test doesn't demonstrate all students levels of mastery. I may have a student that can't talk or read, but they could show you how they would contact EMS or which items of clothing they need. To be an \"alternate\" assessment it needs to be a way for them to demonstrate their skills. Otherwise, most students, in all honesty, are just clicking the buttons.", "role": "Teacher or Test Administrator"}, {"id": 459, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "More information about the supplemental, paper, and vision impaired supports would be helpful for all team members.", "role": "District test coordinator or district administrator"}, {"id": 460, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Talking Tools, calculator", "role": "Teacher or Test Administrator"}, {"id": 461, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I do not think the Decision Making Tool that we use to determine if the students are eligible to take the Alternative Assessment is appropriate. I think it is too difficult/ hard to get Alternative Assessed. The options are not relevant to a lot of students. There are lots of students that don't qualify due to the Decision Tool but the Standard State Tests is not appropriate for them either, it is too hard. Many students would benefit from the Alternative Assessment if the guidelines were changed to be more inclusive. We need to have a more inclusive Decision Making Tool in assessing students for the Alternative Assessment.", "role": "Teacher or Test Administrator"}, {"id": 462, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The testing window could be longer so it can line up with the other testing windows in the district.", "role": "Teacher or Test Administrator"}, {"id": 463, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Personal SGD Communication Device for the paper version only to respond \"A, B, C, D\" to each presented questions", "role": "Teacher or Test Administrator"}, {"id": 464, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I feel the guidelines need to be a little more flexible, as I have a student who is able to toilet with 75% independence, but cannot cognitively function through the standardized test. However, according to the current decision making tool, he would have to. I feel it does not accurately assess each student's abilities.", "role": "Teacher or Test Administrator"}, {"id": 465, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "Let the professionals (aka the actual teacher to the students) decide which test to give them. This stupid tool had all but of of my students not qualify to take the alternate test. I teach in a self contained environment with minimal academic inclusion with most of my students at a kindergarten level, but are made to take the 6th grade standard test. It makes no sense and is extremely frustrating to the teachers and students. Its a waste of time and shows very little of what my students know. You are failing these students and making it impossible for them to show progress and success by having them take the standard state test.", "role": "Teacher or Test Administrator"}, {"id": 466, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "chrome book", "role": "Teacher or Test Administrator"}, {"id": 467, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "If a student qualifies the first time, it seems redundant to do the tool every year. A student with a significant cognitive disability is not going to change much year to year.", "role": "Teacher or Test Administrator"}, {"id": 468, "section": "Administration Logistics & Student Navigation", "question": "Please use the space below to share any additional helpful information from your experience regarding administration logistics and student navigation for the AASCD.", "comment": "The problem we run into is that the TIDE portal and the information that the testing office  sends us on what test a student is required to take don't match.  We receive official letters from the state showing what a student has earned on each test, whether they students has met competency or not and what their score is.  This information is different than what the testing office tells us and what students have to take and what tests they need.  These are students who must be tested one-on-one and we are being told they have to take tests that they already have met competency for ACCORDING TO THE STATE OF OHIO.  We need more accurate testing information from the testing office in regards to what tests students need and what their scores are.", "role": "Building test coordinator"}, {"id": 469, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "Teacher or Test Administrator"}, {"id": 470, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think that the decision-making tool is too stringent and has too much of an emphasis on ADLs.", "role": "Teacher or Test Administrator"}, {"id": 471, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "I only tested one student who needed text to speech", "role": "Teacher or Test Administrator"}, {"id": 472, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I'm not sure if this survey is just for the decision making tool or for determining eligibility requirements. If it is in part for determining eligibility requirements I want to note that requiring significant support across all areas of daily living does not align with academic objectives of assessment. It seems unrelated that a student who has worked so hard to learn to dress themselves but has not made significant academic progress and now does not qualify for the alternate assessment--an assessment that could actually provide reliable data, where the general test cannot.", "role": "Teacher or Test Administrator"}, {"id": 473, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Dynavox, ProLoQuo2Go", "role": "Teacher or Test Administrator"}, {"id": 474, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I feel that the decision making tool does not fully articulate the needs of the students in regards to their cognitive level of academics vs. daily living skills. (I.e if the student can get dressed or be able to use the bathroom independently). This does not accurately describe their cognitive level as those daily living skills are taught for Long periods of time. It does not address academic level of being able to answer comprehension questions or perform math problem.", "role": "Teacher or Test Administrator"}, {"id": 475, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "choice board", "role": "Teacher or Test Administrator"}, {"id": 476, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There are times the team feels like the true needs of the student are not captured within the decision-making tool.", "role": "District test coordinator or district administrator"}, {"id": 477, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication Device", "role": "Teacher or Test Administrator"}, {"id": 478, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "While the Decision-Making Tool is easy to understand and use, the actual content of it and qualifications for a student to take the AA or not is not appropriate.", "role": "Teacher or Test Administrator"}, {"id": 479, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Supplemental materials", "role": "Teacher or Test Administrator"}, {"id": 480, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I feel that the Decision Making Took, student ability and the Alternate Assessment do not align because many of my students may not use an AAC device but cannot even pass the Alternate Assessment due to comprehension; processing ability. Also the kids that actually, really do qualify using the criteria would not be able to answer or critically think through many of the assessment questions.", "role": "Teacher or Test Administrator"}, {"id": 481, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Tablet", "role": "Teacher or Test Administrator"}, {"id": 482, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "When reviewing the Alternate Assessment Decision Making Tool, I sometimes feel that there are some areas that do not qualify a child for the alternate assessment, when we know the standard assessment is too difficult for the student. For example, a student with autism may be able to communicate, yet not be able to process the information on the assessment questions because it involves a third person perspective.", "role": "District test coordinator or district administrator"}, {"id": 483, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Touch Screen Chromebook", "role": "Teacher or Test Administrator"}, {"id": 484, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Some students should take the AASCD that did not qualify based on the Decision Making Tool. It is not appropriate for all students to take the OST", "role": "Teacher or Test Administrator"}, {"id": 485, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Eye gaze device", "role": "Teacher or Test Administrator"}, {"id": 486, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I feel more students should be eligible for alternative assessment.", "role": "Teacher or Test Administrator"}, {"id": 487, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Text to speech device", "role": "Teacher or Test Administrator"}, {"id": 488, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There are many students who are able to be pretty social and can do some things on their own (toilet or dress), but they may not be the best at it, or do it right 100% of the time, and they are disqualified from the AASCD. It doesn't make sense that those areas predict their testing situation. When looking at the assessment tool as a whole, none of my students should have to test End of Course; they have multiple disabilities and are in my unit for a reason. I also do not think it is fair for the school district (of their residency) to take the hit for those who do not test AASCD. With more and more diagnoses (especially in Autism), and lower cognitive abilities, I would think there could be either another test possibility or a better determination tool.", "role": "Teacher or Test Administrator"}, {"id": 489, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board and tablet", "role": "Teacher or Test Administrator"}, {"id": 490, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I have no concerns about the DMT.", "role": "Teacher or Test Administrator"}, {"id": 491, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "Teacher or Test Administrator"}, {"id": 492, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There are other students who are just as low as qualifying students who don't qualify but would benefit from the alternate assessment. It would be far more appropriate than having these borderline students taking the OST.", "role": "Teacher or Test Administrator"}, {"id": 493, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication device", "role": "Teacher or Test Administrator"}, {"id": 494, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "It is totally illogical. We need to be in touch with reality and real students.  Many students who \"qualify for regular testing can not function mentally above a two year old.", "role": "Teacher or Test Administrator"}, {"id": 495, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication devises, voice output, alternative keyboards, switches", "role": "Other"}, {"id": 496, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Alternate Assessment and Decision-Making Tool are some of the most unjust requirements for educators to follow in this day and age. We are told that less than 1% of the student population should be alternately assessed despite the fact that we have more than 1% of student with profound needs. The tool makes the pathway too narrow and it sets up students with IEPs to fail, especially our learners with intellectual disabilities, multiple disabilities, and level 2 and 3 of autism. This assessment and tool do not focus on the strengths of the individual and are developmentally inappropriate for so many. Ohio must do better, listen to parents, advocates, intervention specialists and most importantly, students with significant and complex needs and disabilities. I have to watch as my students are put through assessments that make them feel worthless and confused. It is wrong. Get your head out of the sand, Ohio.", "role": "Teacher or Test Administrator"}, {"id": 497, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC board", "role": "Teacher or Test Administrator"}, {"id": 498, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The criteria used to determine if a student qualifies to take the Alternate Assessment is seriously flawed. If a child is nonverbal and is not toilet-trained, assessing that child in any academic format is ridiculous, even if the Alternate Assessment is used. Students who should be taking the Alternate Assessment due to being identified as cognitively impaired but who do not meet the current criteria, are therefore forced to take the standard Ohio State Assessment. Having students who receive services under the qualifying disability of Intellectual Disability cannot even understand the regular Ohio Assessment and should be taking the Alternate Assessment to more accurately determine their skill and knowledge level. The criteria that needs to be met for students to take the Alternate Assessment was clearly created by people who are not currently educators teaching in  classrooms with children who are intellectually disabled.", "role": "Teacher or Test Administrator"}, {"id": 499, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC devices were present during the assessments as they are in daily instruction (iPad with Proloquo2Go and iPad mini with Touch Chat HD with Word Power).", "role": "Teacher or Test Administrator"}, {"id": 500, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The current decision-making tool requires standardized testing with accommodations for students who are clearly functioning on a significantly modified curriculum. Most of these students don't even have foundational academic skills, such as letter or number recognition. Despite this, the tool places disproportionate weight on adaptive or functional life skills, like personal care and independence, when determining a student\u2019s ability to access the general education curriculum with accommodations. The students who took the alternate assessment had no chance of being successful because they are working on foundational life skills, and the students who would have had some success on the Alternate Assessment had to take a grade level assessment for curriculum they cannot access. This framework sets all of the students with significant cognitive disabilities up for failure when it comes to state testing.", "role": "Teacher or Test Administrator"}, {"id": 501, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "Teacher or Test Administrator"}, {"id": 502, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is useless. If a student is in a resource classroom they should be taking the Alternate Assessment. Period. Students in the resource classroom are being taught by the extended standards and then tested on the regular standards. That makes absolutely zero sense.", "role": "Teacher or Test Administrator"}, {"id": 503, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "Teacher or Test Administrator"}, {"id": 504, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I would like to see more of my students qualified to take the AA", "role": "Teacher or Test Administrator"}, {"id": 505, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC device", "role": "Teacher or Test Administrator"}, {"id": 506, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I wish my whole class could take the A.A. There are so many kids that cannot take the alternate assessment due to the Decision Tree. I believe any student in a self contained classroom regardless of the Decision Tree should be alternately assessed not given the State Test with typical peers, that serves no justification for them or the I.S. and team that works endless hours on extended standards and more.", "role": "Teacher or Test Administrator"}, {"id": 507, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "speech generated devices", "role": "Teacher or Test Administrator"}, {"id": 508, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "While the DMT does have some of the requirements for an alternative assessment there are many students who should be able to take it that are in the level 2 section.", "role": "Teacher or Test Administrator"}, {"id": 509, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Speech Device", "role": "District test coordinator or district administrator"}, {"id": 510, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I disagree with the Decision Making Tool that doesn't allow for more students to qualify for the alternate version of the assessment. Most of my students would have qualified in the past and are now expected to take the standard form of the assessment even though they are learning using the Extended Standards. There needs to be more flexibility and differentiation across the state assessments to meet the needs of our diverse students. (Maybe just make another version of the standard assessment that has shorter reading passages, more picture choices, and math that is based on the extended standards. That would allow for those kids in the \"middle\" to show what they know without being measured against a depth of standards that they aren't working on.)", "role": "Teacher or Test Administrator"}, {"id": 511, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication devices", "role": "Teacher or Test Administrator"}, {"id": 512, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Alternate assessment tool should be digital. Also, it should incorporate instructional suggestions to enhance its effectiveness.", "role": "Teacher or Test Administrator"}, {"id": 513, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication device", "role": "District test coordinator or district administrator"}, {"id": 514, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There is a huge disparity in the types of questions in the Alternate Assessment compared to the regular OSTs.\n I have students that do not qualify for alternate assessment but whose cognitive abilities are so low. that the regular OSTs are completely impossible for those students. I would love to see some different options for those in-between students.", "role": "Teacher or Test Administrator"}, {"id": 515, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "text to speech", "role": "Teacher or Test Administrator"}, {"id": 516, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "thanks for helping teams in being objective about this population of students.", "role": "Did not have a student qualified for this type of Assessment"}, {"id": 517, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Eye gaze and choice boards on speech device", "role": "Teacher or Test Administrator"}, {"id": 518, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The tool is too narrow.  It seems that if you can use the toilet independently then you are not eligible.  It does not take into account the significant cognitive and academic needs of students who are able to go to the bathroom on their own, wash their hands, brush their hair and teeth.  We have kids with significant cognitive and academic needs who are able to perform some of these self-care tasks but need a modified curriculum.  The alternate assessment does not take into account the intense increase in students with autism in Northeast Ohio and that there may be a higher than typical number of students in our region that need alternate assessment yet we are penalized if we go over the 1% rule.  It would be nice if we could just give every student what they need without the threat of penalty.", "role": "Other"}, {"id": 519, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Communication Boards", "role": "Teacher or Test Administrator"}, {"id": 520, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The tool is easy to use on focus to guide team in decisions and discuss with families", "role": "Teacher or Test Administrator"}, {"id": 521, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "alternative keyboard", "role": "Teacher or Test Administrator"}, {"id": 522, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision-making tool is a bit excessive, in my opinion. Could the tool be shorter in years AFTER the student originally meets the requirements? Could there be a tiered tool?\n\nIn addition, the assessment still does not meet the needs of all students with significant disabilities. This assessment would be great for more moderate students who struggle to access the OST but who have more adaptive skills than our highest-support need students.", "role": "Teacher or Test Administrator"}, {"id": 523, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "text to speech, a bigger computer monitor for visually impaired, scribes", "role": "District test coordinator or district administrator"}, {"id": 524, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "No additional information", "role": "Teacher or Test Administrator"}, {"id": 525, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Student chrome books", "role": "Teacher or Test Administrator"}, {"id": 526, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The tool is effective.", "role": "Teacher or Test Administrator"}, {"id": 527, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "tablet", "role": "Building test coordinator"}, {"id": 528, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "There is misalignment between those that qualify for the AASCD based upon the decision-making framework and the level of complexity and rigor that is expected for the AASCD.  The state needs to take into consideration those that qualify for the AASCD are going to most likely have difficulties accessing and completing the assessment items for the assessment.  \nIt is a sad that the majority of students do not pass AASCD across the state.  This really feels like the state is using this as another way to try to make it look like public school is failing, when in reality there is misalignment of expectations.", "role": "District test coordinator or district administrator"}, {"id": 529, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "iPad", "role": "Teacher or Test Administrator"}, {"id": 530, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool eliminates too many students from taking the Alternate Assessment.", "role": "Teacher or Test Administrator"}, {"id": 531, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "iPad-with PECS", "role": "Teacher or Test Administrator"}, {"id": 532, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "It is too strict for students who would otherwise benefit from alternate assessment.", "role": "Teacher or Test Administrator"}, {"id": 533, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board", "role": "Teacher or Test Administrator"}, {"id": 534, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "It can be hard to determine the difference between significant support and significant adult assistance. It would be nice to have a determination chart to identify the levels of assistance. Like hand over hand/physical prompts would be significant assistance vs a support level.", "role": "Teacher or Test Administrator"}, {"id": 535, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Ipad communication", "role": "Teacher or Test Administrator"}, {"id": 536, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "This has nothing to do with the AASCD tool. This alternative assessment was TERRIBLE!!!  The answers to some of the questions were incorrect and there is no way a student could select a correct answer because the test and answers were incorrect. I STRONGLY suggest you look at the questions and answers again.  Highly disappointed in this assessment.", "role": "Teacher or Test Administrator"}, {"id": 537, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "AAC Device, Communication boards", "role": "District test coordinator or district administrator"}, {"id": 538, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "We find that students who should qualify often do not solely because of their social skills being above the required marker. Students can be social and still require a significant level of support across the school environment.", "role": "District test coordinator or district administrator"}, {"id": 539, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Alternative Communication - iPad with speech software", "role": "Teacher or Test Administrator"}, {"id": 540, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "Every student and their needs are so vastly different, it is hard to condense that into 4 different groupings and explain what the student is really like.", "role": "Teacher or Test Administrator"}, {"id": 541, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Handheld Calculator", "role": "District test coordinator or district administrator"}, {"id": 542, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is requiring students whose instruction is primarily in the extended standards take the general education assessment. While I definitely agree with the narrower requirements on who can take the test, it has been narrowed so far that there are students taking the general education test that are so far from the ability level. It is hard to watch them shut down because the test is just way too rigorous for their current learning levels and needs.", "role": "Teacher or Test Administrator"}, {"id": 543, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Touch screen Chromebook, embedded text-to-speech tool.", "role": "Teacher or Test Administrator"}, {"id": 544, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I don't believe that the decision making tool is set up to determine academic need for the tool.  There are children who can function adaptively  that are not yet able to retain academic knowledge, or able understand the language used in assessments.  I feel there is a lot of adaptive focus in the decision making tool.", "role": "Teacher or Test Administrator"}, {"id": 545, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "iPads with communication apps (TouchChat, LAMP, TD Snap)", "role": "Speech-Language Pathologist"}, {"id": 546, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool is fine. However, it and the 1%cap do not allow for some students who may really need the alternate assessment.", "role": "Teacher or Test Administrator"}, {"id": 547, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "Students used communication boards and touch screen devices or large devices with touch screen capabilities.", "role": "Teacher or Test Administrator"}, {"id": 548, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision tool is used in our district however staff believe that it is an IEP decision and data demonstrating limited growth was used by one building to determine if the students needed  to take the AA rather than the outcome of the decision tool.", "role": "District test coordinator or district administrator"}, {"id": 549, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "communication board and switch", "role": "Teacher or Test Administrator"}, {"id": 550, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The Decision-Making Tool questions do not align with the foundation of Special Education. The traditional state tests are not appropriate for students in cross categorical special education units. These students are taught with a curriculum that does not mirror tradition state tests BUT does mirror the alternate assessment tests. Due to the extremely limiting criteria on the Decision-Making tool, the majority of students in  cross categorical special education units do not qualify for the alternate assessment and instead are subjected to state tests that they are not able to understand and therefor do not reflect their ability of understanding of the content they have been taught. This Decision Making Tool needs to be redesigned to reflect student populations who are in cross categorical special education units so they are able to take an assessment with the content they have been taught throughout the year.", "role": "Teacher or Test Administrator"}, {"id": 551, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "eye gaze", "role": "District test coordinator or district administrator"}, {"id": 552, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "The decision making tool criteria for taking the test is way off.  It makes student's who should be eligible to take the test ineligible due to one small factor like being able to speak in complete sentences.  It is criminal to make my student take the OST when they cannot even recognize their letters and numbers.  It is a big waste of everyone's time and these students would be able to show what the know on the Alternate Assessment.  I have been writing this for years and nothing has changed.  Please make a change to give our students a chance on a state test.  By making these students take the OST it also teaches the kids bad testing habits by forcing them to guess on every question and not understand any of the test.  I cannot disagree any stronger for how this decision-making tool is used by the state.", "role": "Teacher or Test Administrator"}, {"id": 553, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "aac device", "role": "Teacher or Test Administrator"}, {"id": 554, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "I think the requirements are too strict; does not accommodate borderline circumstances;  does not allow for professional input from the teacher, support staff, or parents.", "role": "Teacher or Test Administrator"}, {"id": 555, "section": "Assistive Technology Used", "question": "Please list the AT, tools or devices used by your students during the AASCD.", "comment": "SMARTBoard, iPad", "role": "Teacher or Test Administrator"}, {"id": 556, "section": "Decision-Making Tool Experience", "question": "Additional helpful information regarding your experience using the Decision-Making Tool.", "comment": "For students to make all tier 4 criteria for the first four domains is not appropriate.  There is no way to continue with the other domains, even if we know this assessment is appropriate.  The first four domains focuses on students who are non-verbal and severe physically handicapped.  I have many students who have a significant mental disabilities and standardize testing is not even close to assessing their abilities.  They either don't understand how to use a computer, the questions on standard tests are too wordy, too many applied skills sets questions, and it expect them to read when they don't even know their letters.  Many of my students do not have have physical barriers, have some self helps skills, and some communication skills.  They can walk and move their
